.seal{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:20%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95;color:#f9edf8;background:radial-gradient(circle at 35% 28%,#a76ca4,#713a70 55%,#4e254f);font:italic clamp(17px,5vw,24px) var(--serif);text-shadow:0 1px 1px #2b142b55;box-shadow:0 0 0 6px #713a7040,0 6px 14px #2b142b66,inset 0 -3px 6px #0004,inset 0 2px 3px #fff3;transition:transform .45s cubic-bezier(.5,-.4,.5,1.4)}
.seal:before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px dashed #f9edf899}.seal span{font-size:.50em;margin:1px 0}.stage:not(.open):hover .seal{transform:translate(-50%,-50%) scale(1.08) rotate(-8deg)}
.open .flap{transform:rotateX(180deg);z-index:0}.open .seal{animation:sealOff .5s ease forwards;pointer-events:none}.open .envelope{animation:envDrop 3s ease forwards}.open .piece{animation:pieceFade 3s ease forwards}.open .card{animation:cardOut 3s cubic-bezier(.4,0,.2,1) forwards}
.prompt{margin-top:16px;font-size:9.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--plum);animation:pulse 2.4s ease-in-out infinite}.scene:has(.open) .prompt{opacity:0;animation:none}
.hint{color:#8a6487;font:italic 16px/1.5 var(--serif);margin:4px auto 0;max-width:300px}.reset{margin-top:14px;border:1px solid #c9a9c7;color:var(--plum);background:#fff9;border-radius:30px;padding:10px 20px;font:10px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;display:none}.reset:hover{background:var(--plum);color:#fff}.footer{margin-top:10px;color:#9a7897;font-size:9.5px;letter-spacing:.18em}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.petal{position:absolute;top:-20px;width:10px;height:13px;border-radius:60% 0 60% 0;opacity:0;animation:fall linear forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sealOff{to{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(25deg);visibility:hidden}}@keyframes envDrop{0%,35%{transform:translateY(0)}62%{transform:translateY(30%)}100%{transform:translateY(42%)}}
@keyframes pieceFade{0%,62%{opacity:1}92%,100%{opacity:0;visibility:hidden}}@keyframes cardOut{0%,35%{transform:translateY(0) scale(.88);z-index:2}62%{transform:translateY(-52%) scale(.9);z-index:2}63%{z-index:9}100%{transform:translateY(-42%) scale(1);z-index:9}}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(var(--drift),105vh) rotate(var(--spin))}}
@media(max-height:700px){.stage{width:min(100%,calc((100svh - 155px)*1240/1748))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}.petals{display:none}}
</style></head>
  <body>
<main class="scene"><p class="eyebrow">In Sha Allah..</p>
<div class="stage" id="stage" role="button" tabindex="0" aria-label="Tap to Open"><div class="envelope">
<div class="piece env-back"></div>
  <div class="card"><img src="Beige%20Pink%20Simple%20Flower%20Wedding%20Invitation%20(1).jpg" alt="Wedding Invitation"></div>
<div class="piece env-left"></div>
  <div class="piece env-right"></div>
  <div class="piece env-bottom"></div>
  
  <div class="piece flap"></div>
  <div class="seal"><b>H</b><span>&amp;</span><b>W</b></div></div></div>
<div class="prompt">Tap to open</div><p class="hint" id="hint">A little note, sealed with love.</p>
  <div><button class="reset" id="reset" type="button">↺</button></div>
  <div class="footer">H &amp; W</div></main>
<div class="petals" id="petals" aria-hidden="true"></div>
<script>
const stage=document.getElementById('stage'),reset=document.getElementById('reset'),hint=document.getElementById('hint'),petals=document.getElementById('petals');
const petalColors=['#f2c9d0','#f7dfe3','#e8a9b4','#d9b7d8','#b98cba'];
function toggleOpen(){const isOpen=stage.classList.toggle('open');stage.setAttribute('aria-label',isOpen?'Wedding invitation opened':'Open the wedding invitation');
                      hint.textContent=isOpen?'We can’t wait to celebrate this special day with you.':'A little note, sealed with love.';reset.style.display=isOpen?'inline-block':'none';if(isOpen)setTimeout(showerPetals,2200);}
function showerPetals(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<28;i++){const p=document.createElement('span');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.background=petalColors[i%petalColors.length];p.style.setProperty('--drift',(Math.random()*120-60)+'px');p.style.setProperty('--spin',(Math.random()*540-270)+'deg');p.style.animationDuration=4+Math.random()*3+'s';p.style.animationDelay=Math.random()*1.5+'s';petals.appendChild(p);p.addEventListener('animationend',()=>p.remove());}}
stage.addEventListener('click',toggleOpen);stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleOpen();}});reset.addEventListener('click',e=>{e.stopPropagation();if(stage.classList.contains('open'))toggleOpen();});
</script></body></html>
